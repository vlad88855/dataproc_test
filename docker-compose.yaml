version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  webserver:
    image: apache/airflow:3.1.0
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__LOGS__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_UID: "50000"
      AIRFLOW_VAR_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-your-gcp-project-id}
      AIRFLOW_VAR_GCP_REGION: ${GCP_REGION:-us-central1}
      AIRFLOW_VAR_GCS_BUCKET: ${GCS_BUCKET:-your-gcs-bucket}
      AIRFLOW_VAR_DATAPROC_CLUSTER_NAME: ${DATAPROC_CLUSTER_NAME:-poc-dataproc-cluster}
      AIRFLOW_VAR_DATAPROC_ZONE: ${DATAPROC_ZONE:-us-central1-a}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com --password admin || true && airflow webserver"

  scheduler:
    image: apache/airflow:3.1.0
    depends_on:
      - postgres
      - webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__LOGS__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_UID: "50000"
      AIRFLOW_VAR_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-your-gcp-project-id}
      AIRFLOW_VAR_GCP_REGION: ${GCP_REGION:-us-central1}
      AIRFLOW_VAR_GCS_BUCKET: ${GCS_BUCKET:-your-gcs-bucket}
      AIRFLOW_VAR_DATAPROC_CLUSTER_NAME: ${DATAPROC_CLUSTER_NAME:-poc-dataproc-cluster}
      AIRFLOW_VAR_DATAPROC_ZONE: ${DATAPROC_ZONE:-us-central1-a}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: airflow scheduler

volumes:
  pgdata: {}